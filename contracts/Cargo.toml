[workspace]
resolver = "2"

members = [
    "hunt-factory",
    "hunt-instance",
    "reputation",
    "dispute",
    "quest-chain",
]

[workspace.dependencies]
soroban-sdk = "27.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = true
lto = true
codegen-units = 1
panic = "abort"
