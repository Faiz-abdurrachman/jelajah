version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: jelajah-db
    environment:
      POSTGRES_DB: jelajah
      POSTGRES_USER: jelajah
      POSTGRES_PASSWORD: jelajah_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/web/lib/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jelajah"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
